<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Tático - Torneio de Tiro OP RR</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#FFD700">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="./android-chrome-512x512.png">
<link rel="icon" type="image/png" href="./android-chrome-512x512.png">

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.onupdatefound = () => {
      const newWorker = reg.installing;
      newWorker.onstatechange = () => {
        if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
          if(confirm('Nova versão disponível! Atualizar agora?')){
            newWorker.postMessage('SKIP_WAITING');
            window.location.reload();
          }
        }
      }
    }
  });
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #e5e7eb; font-family: 'Segoe UI', Arial, sans-serif; padding: 10px; }
.header { display: flex; align-items: center; justify-content: center; gap: 15px; padding: 15px; background: linear-gradient(90deg, #1a1a1a 0%, #222 100%); border-bottom: 3px solid #FFD700; border-radius: 8px; margin-bottom: 15px; }
.header .alvo-logo {
    width: 55px;
    height: 55px;
    object-fit: contain;
    filter: drop-shadow(0 0 2px #ffd90042);
}
.header h1 { color: #ffd900; font-size: 25px; text-align: center; font-weight: 700; }
.tabs { display: flex; gap: 5px; margin-bottom: 10px; }
.tab { flex:1; padding: 10px; background: #222; border: 1px solid #444; color: #ccc; border-radius: 5px; cursor: pointer; text-align: center; font-size: 14px; }
.tab.active { background: #ffd900; color: #000; font-weight: bold; }
.card { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #333; display: none; }
.card.active { display: block; }
    label { font-size: 14px; color: #ccc; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; background: #222; color: white; border: 1px solid #444; border-radius: 5px; font-size: 16px; }
    button { background: linear-gradient(90deg, #ffd90042 0%, #FFA500 100%); color: #000; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { filter: brightness(1.1); }
.btn-danger { background: #c00; color: #fff; }
.btn-pdf { background: #0a58ca; color: #fff; }
.btn-save { background: #16a34a; color: #fff; }
.btn-load { background: #7c3aed; color: #fff; }
.lista { margin-top: 10px; max-height: 250px; overflow-y: auto; }
.item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #222; margin: 5px 0; border-radius: 5px; border-left: 3px solid #FFD700; }
.item b { color: #ffd900; }
.item button { width: auto; padding: 5px 10px; margin: 0; font-size: 12px; background: #c00; }
.modalidade-tag { font-size: 11px; background: #333; padding: 2px 6px; border-radius: 4px; color: #FFD700; }
.subtabs { display: flex; gap: 5px; margin-bottom: 10px; }
.subtab { flex:1; padding: 8px; background: #333; color: #ccc; border-radius: 5px; cursor: pointer; text-align: center; font-size: 13px; }
.subtab.active { background: #ffd900; color: #000; font-weight: bold; }
</style>
</head>
<body>

<header class="header">
    <img src="brasao-op.png" alt="Teste" class="alvo-logo">
    <h1>TORNEIO DE TIRO ASSOP</h1>
</header>

<div class="tabs">
    <div class="tab active" onclick="trocarAba('cadastro', this)">Cadastro</div>
    <div class="tab" onclick="trocarAba('lancar', this)">Lançar</div>
    <div class="tab" onclick="trocarAba('ranking', this)">Ranking</div>
    <div class="tab" onclick="trocarAba('arquivo', this)">Arquivo</div>
</div>

<div id="cadastro" class="card active">
    <button class="btn-danger" onclick="resetarSistema()" style="margin-bottom:10px;">Resetar Sistema</button>
    <h3 style="color:#ffd900;">Cadastrar Time</h3>
    <input type="text" id="nomeTime" placeholder="Ex: ALFA">
    <button onclick="addTime()">+ Adicionar Time</button>
    <div id="listaTimes" class="lista"></div>
    <h3 style="color:#ffd900; margin-top:20px;">Cadastrar Atiradores</h3>
    <select id="timeSelectCadastro" onchange="atualizarAtiradoresCadastro()"></select>
    <input type="text" id="nomeAtirador" placeholder="Ex: Silva">
    <button onclick="addAtirador()">+ Adicionar Atirador</button>
    <div id="listaAtiradores" class="lista"></div>
</div>

<div id="lancar" class="card">
    <h3 style="color:#ffd900;">Lançar Resultado</h3>
    <label>Time:</label><select id="timeSelectLancar" onchange="atualizarAtiradoresLancar()"></select>
    <label>Atirador:</label><select id="atiradorSelectLancar" onchange="carregarPontuacaoArma()"></select>
    <label>Arma/Modalidade:</label>
    <select id="modalidadeSelect" onchange="carregarPontuacaoArma()">
        <option value="Pistola">Pistola</option>
        <option value="Cal. 12">Cal. 12</option>
        <option value="T4">T4</option>
    </select>
    <label>Acertos:</label><input type="number" id="acertos" value="0">
    <label>Tempo s:</label><input type="number" step="0.01" id="tempo" value="0">
    <label>Penalidades:</label><input type="number" id="penalidades" value="0">
    <button onclick="salvarResultado()">Salvar Resultado</button>
</div>

<div id="ranking" class="card">
    <div class="subtabs">
        <div class="subtab active" onclick="trocarSubAba('individual', this)">Individual</div>
        <div class="subtab" onclick="trocarSubAba('time', this)">Por Time</div>
    </div>
    <label>Filtrar por Arma:</label>
    <select id="filtroModalidade" onchange="atualizarRanking()">
        <option value="Geral">Geral</option>
        <option value="Pistola">Pistola</option>
        <option value="Cal. 12">Cal. 12</option>
        <option value="T4">T4</option>
    </select>
    <button class="btn-pdf" onclick="gerarPDF()">Baixar PDF do Ranking</button>
    <button class="btn-danger" onclick="zerarPontos()">Zerar Pontos</button>
    <div id="listaRanking" class="lista"></div>
</div>

<div id="arquivo" class="card">
    <h3 style="color:#ffd900;">Salvar e Resgatar Torneio</h3>
    <p style="font-size:14px; color:#aaa; margin-bottom:10px;">Salve com a data de hoje ou escolha um backup antigo pra resgatar</p>
    <button class="btn-save" onclick="salvarBackup()">Salvar Backup com Data de Hoje</button>
    <button class="btn-load" onclick="baixarJSON()">Baixar.json</button>
    <h4 style="color:#ffd900; margin-top:20px;">Backups Salvos no Celular:</h4>
    <div id="listaBackups" class="lista"></div>
    <label style="margin-top:15px;">Ou carregar arquivo.json manual:</label>
    <input type="file" id="inputArquivo" accept=".json" onchange="importarJSON(event)">
</div>

<script>
const MODALIDADES = ["Pistola", "Cal. 12", "T4"];
let dados = JSON.parse(localStorage.getItem('placarTiroOP_v2')) || {times: []};
let modoRanking = 'individual';

function salvar() {
  let timeLancarIdx = document.getElementById('timeSelectLancar').selectedIndex;
  let atiradorLancarIdx = document.getElementById('atiradorSelectLancar').selectedIndex;
  let timeCadIdx = document.getElementById('timeSelectCadastro').selectedIndex;

  localStorage.setItem('placarTiroOP_v2', JSON.stringify(dados));
  atualizarTudo();

  document.getElementById('timeSelectLancar').selectedIndex = timeLancarIdx;
  document.getElementById('atiradorSelectLancar').selectedIndex = atiradorLancarIdx;
  document.getElementById('timeSelectCadastro').selectedIndex = timeCadIdx;

  atualizarAtiradoresLancar();
  atualizarAtiradoresCadastro();
  carregarPontuacaoArma();
}

function resetarSistema(){if(confirm('Apagar TUDO?')){localStorage.removeItem('placarTiroOP_v2'); dados = {times: []}; salvar(); alert('Sistema resetado!');}}

function trocarAba(aba, el) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(aba).classList.add('active');
  el.classList.add('active');
  if(aba === 'ranking') atualizarRanking();
  if(aba === 'arquivo') listarBackups();
}

function trocarSubAba(modo, el) {modoRanking = modo; document.querySelectorAll('.subtab').forEach(t => t.classList.remove('active')); el.classList.add('active'); atualizarRanking();}

function addTime() {
  let nome = document.getElementById('nomeTime').value.trim();
  if(!nome) return alert('Digite o nome do time');
  if(dados.times.find(t => t.nome === nome)) return alert('Time já existe');
  dados.times.push({nome, atiradores: []}); // <-- mudou de membros para atiradores
  document.getElementById('nomeTime').value = '';
  salvar();
}

function addAtirador() { // <-- mudou de addMembro
  let select = document.getElementById('timeSelectCadastro');
  let tIdx = select.selectedIndex;
  let nome = document.getElementById('nomeAtirador').value.trim(); // <-- mudou id
  if(tIdx < 0) return alert('Cadastre um time primeiro');
  if(!nome) return alert('Digite o nome do atirador'); // <-- mudou texto
  let resultados = {};
  MODALIDADES.forEach(mod => resultados[mod] = {acertos: 0, tempo: 0, penalidades: 0});
  dados.times[tIdx].atiradores.push({nome, resultados}); // <-- mudou de membros
  document.getElementById('nomeAtirador').value = ''; // <-- mudou id
  salvar();
  select.selectedIndex = tIdx;
  atualizarAtiradoresCadastro(); // <-- mudou função
}

function hitFactor(a,t,p){let pontos = a - p; return t > 0? (pontos / t) : 0;}

function salvarResultado() {
  let tIdx = document.getElementById('timeSelectLancar').selectedIndex;
  let aIdx = document.getElementById('atiradorSelectLancar').selectedIndex; // <-- mudou
  let mod = document.getElementById('modalidadeSelect').value;
  if(tIdx < 0 || aIdx < 0) return alert('Selecione time e atirador'); // <-- mudou texto
  let a = dados.times[tIdx].atiradores[aIdx]; // <-- mudou
  a.resultados[mod].acertos = parseFloat(document.getElementById('acertos').value) || 0;
  a.resultados[mod].tempo = parseFloat(document.getElementById('tempo').value) || 0;
  a.resultados[mod].penalidades = parseFloat(document.getElementById('penalidades').value) || 0;
  alert(`Resultado salvo para ${mod}!`);
  salvar();
}

function atualizarTudo() {
  document.getElementById('listaTimes').innerHTML = dados.times.map((t,i) => `<div class="item"><span>${t.nome} - ${t.atiradores.length} atiradores</span><button onclick="delTime(${i})">X</button></div>`).join(''); // <-- mudou
  let options = dados.times.map(t => `<option>${t.nome}</option>`).join('');
  document.getElementById('timeSelectCadastro').innerHTML = options;
  document.getElementById('timeSelectLancar').innerHTML = options;
}

function atualizarAtiradoresCadastro(){ // <-- mudou
  let tIdx = document.getElementById('timeSelectCadastro').selectedIndex;
  if(tIdx >= 0) {
    document.getElementById('listaAtiradores').innerHTML = dados.times[tIdx].atiradores.map((a,i) => `<div class="item"><span>${a.nome}</span><button onclick="delAtirador(${tIdx},${i})">X</button></div>`).join(''); // <-- mudou
  } else {
    document.getElementById('listaAtiradores').innerHTML = ''; // <-- mudou
  }
}

function atualizarAtiradoresLancar(){ // <-- mudou
  let tIdx = document.getElementById('timeSelectLancar').selectedIndex;
  if(tIdx >= 0) {
    document.getElementById('atiradorSelectLancar').innerHTML = dados.times[tIdx].atiradores.map(a => `<option>${a.nome}</option>`).join(''); // <-- mudou
    carregarPontuacaoArma();
  } else {
    document.getElementById('atiradorSelectLancar').innerHTML = ''; // <-- mudou
  }
}

function carregarPontuacaoArma(){
  let tIdx = document.getElementById('timeSelectLancar').selectedIndex;
  let aIdx = document.getElementById('atiradorSelectLancar').selectedIndex; // <-- mudou
  let mod = document.getElementById('modalidadeSelect').value;
  if(tIdx >= 0 && aIdx >= 0){
    let r = dados.times[tIdx].atiradores[aIdx].resultados[mod]; // <-- mudou
    document.getElementById('acertos').value = r.acertos;
    document.getElementById('tempo').value = r.tempo;
    document.getElementById('penalidades').value = r.penalidades;
  } else {
    document.getElementById('acertos').value = 0;
    document.getElementById('tempo').value = 0;
    document.getElementById('penalidades').value = 0;
  }
}

document.getElementById('timeSelectCadastro').onchange = atualizarAtiradoresCadastro; // <-- mudou

function delTime(i) { if(confirm('Apagar time e todos atiradores?')) { dados.times.splice(i,1); salvar(); } } // <-- mudou
function delAtirador(t,i) { if(confirm('Apagar atirador?')) { dados.times[t].atiradores.splice(i,1); salvar(); } } // <-- mudou

function atualizarRanking() {
  let filtro = document.getElementById('filtroModalidade').value;
  if(modoRanking === 'individual'){
    let lista = [];
    dados.times.forEach(time => {
      time.atiradores.forEach(a => { // <-- mudou
        if(filtro === "Geral") {
          MODALIDADES.forEach(mod => {
            let r = a.resultados[mod];
            lista.push({time: time.nome, nome: a.nome, mod, hf: hitFactor(r.acertos, r.tempo, r.penalidades)}); // <-- mudou
          })
        } else {
          let r = a.resultados[filtro];
          lista.push({time: time.nome, nome: a.nome, mod: filtro, hf: hitFactor(r.acertos, r.tempo, r.penalidades)}); // <-- mudou
        }
      })
    });
    lista.sort((a,b) => b.hf - a.hf);
    document.getElementById('listaRanking').innerHTML = lista.slice(0,50).map((i,idx) =>
      `<div class="item"><span>${idx+1}. ${i.time} - ${i.nome} <span class="modalidade-tag">${i.mod}</span></span><b>${i.hf.toFixed(2)}</b></div>`
    ).join('') || '<p>Nenhum resultado lançado</p>';
  } else {
    let lista = [];
    dados.times.forEach(time => {
      let hfTotal = 0;
      let count = 0;
      time.atiradores.forEach(a => { // <-- mudou
        if(filtro === "Geral") {
          MODALIDADES.forEach(mod => {
            let r = a.resultados[mod];
            hfTotal += hitFactor(r.acertos, r.tempo, r.penalidades);
            count++;
          })
        } else {
          let r = a.resultados[filtro];
          hfTotal += hitFactor(r.acertos, r.tempo, r.penalidades);
          count++;
        }
      });
      let media = count > 0? hfTotal / count : 0;
      lista.push({nome: time.nome, hf: media, atiradores: time.atiradores.length}); // <-- mudou
    });
    lista.sort((a,b) => b.hf - a.hf);
    document.getElementById('listaRanking').innerHTML = lista.map((i,idx) =>
      `<div class="item"><span>${idx+1}. ${i.nome} - ${i.atiradores} atiradores</span><b>${i.hf.toFixed(2)}</b></div>` // <-- mudou
    ).join('') || '<p>Nenhum time cadastrado</p>';
  }
}

function zerarPontos() {
  if(confirm('Zerar só os resultados?')) {
    dados.times.forEach(t => t.atiradores.forEach(a => { // <-- mudou
      MODALIDADES.forEach(mod => a.resultados[mod] = {acertos:0, tempo:0, penalidades:0}) // <-- mudou
    }));
    salvar();
  }
}

function gerarPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let filtro = document.getElementById('filtroModalidade').value;
  let tipo = modoRanking === 'individual'? 'INDIVIDUAL' : 'POR TIME';
  doc.setFontSize(18);
  doc.text(`RANKING ${tipo} - ${filtro} - OP RR`, 105, 20, {align: "center"});
  let y = 40;
  doc.setFontSize(11);
  if(modoRanking === 'individual'){
    let lista = [];
    dados.times.forEach(time => {
      time.atiradores.forEach(a => { // <-- mudou
        if(filtro === "Geral") {
          MODALIDADES.forEach(mod => {
            let r = a.resultados[mod];
            lista.push({time: time.nome, nome: a.nome, mod, hf: hitFactor(r.acertos, r.tempo, r.penalidades)}); // <-- mudou
          })
        } else {
          let r = a.resultados[filtro];
          lista.push({time: time.nome, nome: a.nome, mod: filtro, hf: hitFactor(r.acertos, r.tempo, r.penalidades)}); // <-- mudou
        }
      })
    });
    lista.sort((a,b) => b.hf - a.hf);
    lista.forEach((i,idx) => {
      if(y > 280) { doc.addPage(); y = 20; }
      doc.text(`${idx+1}. ${i.time} - ${i.nome} [${i.mod}]`, 15, y);
      doc.text(`HF: ${i.hf.toFixed(2)}`, 160, y);
      y += 10;
    });
  } else {
    let lista = [];
    dados.times.forEach(time => {
      let hfTotal = 0;
      let count = 0;
      time.atiradores.forEach(a => { // <-- mudou
        if(filtro === "Geral") {
          MODALIDADES.forEach(mod => {
            hfTotal += hitFactor(a.resultados[mod].acertos, a.resultados[mod].tempo, a.resultados[mod].penalidades); // <-- mudou
            count++;
          })
        } else {
          let r = a.resultados[filtro];
          hfTotal += hitFactor(r.acertos, r.tempo, r.penalidades);
          count++;
        }
      });
      lista.push({nome: time.nome, hf: count > 0? hfTotal / count : 0});
    });
    lista.sort((a,b) => b.hf - a.hf);
    lista.forEach((i,idx) => {
      if(y > 280) { doc.addPage(); y = 20; }
      doc.text(`${idx+1}. ${i.nome}`, 15, y);
      doc.text(`HF Médio: ${i.hf.toFixed(2)}`, 140, y);
      y += 10;
    });
  }
  doc.save(`Ranking_${tipo}_${filtro}_OP_RR.pdf`);
}

function salvarBackup(){let data = new Date().toLocaleDateString('pt-BR').replace(/\//g, '-'); let hora = new Date().toLocaleTimeString('pt-BR'); let chave = `backup_torneio_${data}_${hora}`; localStorage.setItem(chave, JSON.stringify(dados)); alert(`Backup salvo: ${data} ${hora}`); listarBackups();}
function listarBackups(){let backups = []; for(let i=0; i<localStorage.length; i++){let chave = localStorage.key(i); if(chave.startsWith('backup_torneio_')){backups.push(chave);}} backups.sort().reverse(); document.getElementById('listaBackups').innerHTML = backups.map(chave => {let data = chave.replace('backup_torneio_', '').replace(/_/g, ' '); return `<div class="item"><span>${data}</span><div><button style="background:#7c3aed" onclick="resgatarBackup('${chave}')">Resgatar</button><button onclick="apagarBackup('${chave}')">X</button></div></div>`}).join('') || '<p>Nenhum backup salvo</p>';}
function resgatarBackup(chave){if(confirm(`Deseja resgatar o backup de ${chave}?`)){dados = JSON.parse(localStorage.getItem(chave)); salvar(); alert('Backup resgatado com sucesso!');}}
function apagarBackup(chave){if(confirm('Apagar este backup?')){localStorage.removeItem(chave); listarBackups();}}
function baixarJSON(){const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dados)); const dl = document.createElement('a'); dl.setAttribute('href', dataStr); dl.setAttribute('download', `Torneio_OP_RR_${new Date().toLocaleDateString('pt-BR')}.json`); dl.click();}
function importarJSON(event){const file = event.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = function(e){try {dados = JSON.parse(e.target.result); salvar(); alert('Arquivo carregado com sucesso!');} catch {alert('Arquivo inválido!');}}; reader.readAsText(file);}

atualizarTudo();
</script>
</body>
</html>
